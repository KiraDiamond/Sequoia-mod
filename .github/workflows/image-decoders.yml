name: Image decoder builds
on:
  workflow_dispatch:
  pull_request:
    paths:
      - native/**
      - src/main/resources/sandbox/**
      - src/test/resources/klipy-report.mp4
      - .github/workflows/image-decoders.yml
  push:
    paths:
      - native/**
      - src/main/resources/sandbox/**
      - src/test/resources/klipy-report.mp4
      - .github/workflows/image-decoders.yml
concurrency:
  group: native-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  provenance:
    name: provenance
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check bundled artifacts against provenance and sources
        run: python3 native/check-provenance.py
  native:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {platform: windows-x86_64, runner: windows-2025}
          - {platform: windows-aarch64, runner: windows-11-arm}
          - {platform: linux-x86_64, runner: ubuntu-24.04}
          - {platform: linux-aarch64, runner: ubuntu-24.04-arm}
          - {platform: macos-x86_64, runner: macos-15-intel}
          - {platform: macos-aarch64, runner: macos-15}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux static linker
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Install stable Rust
        shell: bash
        run: |
          if ! command -v cargo >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o "$RUNNER_TEMP/rustup-init.sh"
            sh "$RUNNER_TEMP/rustup-init.sh" -y --profile minimal
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          else
            rustup update stable --no-self-update
            rustup default stable
          fi
      - name: Select native Windows ARM Rust toolchain
        if: matrix.platform == 'windows-aarch64'
        run: |
          rustup toolchain install stable-aarch64-pc-windows-msvc --profile minimal
          rustup default stable-aarch64-pc-windows-msvc
      - name: Build, test and verify a fresh helper
        run: python native/build-native.py ${{ matrix.platform }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-${{ matrix.platform }}
          path: build/native/${{ matrix.platform }}/
          if-no-files-found: error
          retention-days: 14
      - name: Verify the committed helper with the same probes
        run: python native/verify-committed.py ${{ matrix.platform }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: committed-${{ matrix.platform }}
          path: |
            build/native/${{ matrix.platform }}/committed-*.json
          if-no-files-found: ignore
          retention-days: 14
