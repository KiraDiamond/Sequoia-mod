name: Image decoder builds
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  wasm:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test download verification and packaging
        run: python3 -m unittest discover -s native/tests -p test_build_inputs.py
      - name: Fetch verified upstream sources and compile the WASM decoder
        run: bash native/build-wasm.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: decoder-wasm
          path: build/native-wasm/decoder.wasm
          if-no-files-found: error
          retention-days: 14
  native:
    needs: wasm
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {platform: windows-x86_64, runner: windows-2025}
          - {platform: windows-aarch64, runner: windows-11-arm}
          - {platform: linux-x86_64, runner: ubuntu-24.04}
          - {platform: linux-aarch64, runner: ubuntu-24.04-arm}
          - {platform: macos-x86_64, runner: macos-15-intel}
          - {platform: macos-aarch64, runner: macos-15}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: decoder-wasm
          path: build/native-wasm
      - name: Install Linux static linker
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Install stable Rust
        shell: bash
        run: |
          if ! command -v cargo >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o "$RUNNER_TEMP/rustup-init.sh"
            sh "$RUNNER_TEMP/rustup-init.sh" -y --profile minimal
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          else
            rustup update stable --no-self-update
            rustup default stable
          fi
      - name: Select native Windows ARM Rust toolchain
        if: matrix.platform == 'windows-aarch64'
        run: |
          rustup toolchain install stable-aarch64-pc-windows-msvc --profile minimal
          rustup default stable-aarch64-pc-windows-msvc
      - name: Build, test and verify a fresh helper
        run: python native/build-native.py ${{ matrix.platform }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-${{ matrix.platform }}
          path: build/native/${{ matrix.platform }}/
          if-no-files-found: error
          retention-days: 14
