name: Build

on:
  push:
    branches: ["**"]
    tags-ignore:
      - "v*"
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Java 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21.0.13+9'
          cache: gradle

      - name: Test Java blocklist installer
        shell: bash
        run: bash tests/install-java-blocklist.sh

      - name: Update Java certificate blocklist
        shell: bash
        run: bash scripts/install-java-blocklist.sh "$JAVA_HOME"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew clean build remapJar --stacktrace

  windows-updater-tests:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Temurin has no 21.0.13 Windows build yet; Zulu ships the same October update.
      # Return to temurin 21.0.13+9 once Adoptium publishes it for Windows x64.
      - name: Setup Java 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: zulu
          java-version: '21.0.13'
          cache: gradle

      - name: Test Java blocklist installer
        shell: bash
        run: bash tests/install-java-blocklist.sh

      - name: Update Java certificate blocklist
        shell: bash
        run: bash scripts/install-java-blocklist.sh "$JAVA_HOME"

      - name: Run updater tests on Windows
        run: .\gradlew.bat test --tests com.seqwawa.seq.update.UpdateManagerTest --tests com.seqwawa.seq.update.UpdateApplierTest --stacktrace

      - name: Upload Windows updater test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-updater-test-reports
          path: |
            build/reports/tests/test
            build/test-results/test
