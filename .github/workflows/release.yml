name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

# One release per tag at a time; a second run waits instead of publishing over the first.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build.yml

  # Publishes exactly the JAR and native source archive the build job built and tested.
  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create the GitHub release and upload its assets
    env:
      MODRINTH_PROJECT_SLUG: sequoia

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: jar
          path: build/libs

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: corresponding-source
          path: build/corresponding-source

      - name: Resolve release metadata
        id: release_metadata
        shell: bash
        run: |
          set -euo pipefail

          version_number="${GITHUB_REF_NAME#v}"
          minecraft_version="$(sed -n 's/^minecraft_version=//p' gradle.properties)"
          changelog="$(git tag -l --format='%(contents)' "$GITHUB_REF_NAME")"

          mapfile -t release_jars < <(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' | sort)
          if [[ "${#release_jars[@]}" -ne 1 ]]; then
            echo "Expected exactly one release jar, found ${#release_jars[@]}" >&2
            printf 'Found jars:\n%s\n' "${release_jars[@]}" >&2
            exit 1
          fi

          version_type="release"
          normalized_version="${version_number,,}"
          if [[ "$normalized_version" == *alpha* ]]; then
            version_type="alpha"
          elif [[ "$normalized_version" == *beta* ]]; then
            version_type="beta"
          fi

          if [[ -z "$changelog" || "$changelog" == "$GITHUB_REF_NAME" ]]; then
            changelog="GitHub release notes: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME}"
          fi

          {
            echo "mod_jar=${release_jars[0]}"
            echo "minecraft_version=${minecraft_version}"
            echo "version_number=${version_number}"
            echo "version_type=${version_type}"
            delimiter="changelog_$(openssl rand -hex 16)"
            echo "changelog<<${delimiter}"
            echo "${changelog}"
            echo "${delimiter}"
          } >> "$GITHUB_OUTPUT"

      - name: Generate SHA-256 files
        shell: bash
        run: |
          set -euo pipefail
          # Record only the file name, so a downloaded asset checks with sha256sum -c.
          for file in build/libs/*.jar build/corresponding-source/*; do
            (cd "$(dirname "$file")" && sha256sum "$(basename "$file")") > "$file.sha256"
          done

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            build/libs/*.jar
            build/libs/*.jar.sha256
            build/corresponding-source/*

      - name: Publish to Modrinth
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          VERSION_NUMBER: ${{ steps.release_metadata.outputs.version_number }}
          CHANGELOG: ${{ steps.release_metadata.outputs.changelog }}
          MINECRAFT_VERSION: ${{ steps.release_metadata.outputs.minecraft_version }}
          VERSION_TYPE: ${{ steps.release_metadata.outputs.version_type }}
          MOD_JAR: ${{ steps.release_metadata.outputs.mod_jar }}
          SOURCE_ARCHIVE: build/corresponding-source/sequoia-images-native-source.zip
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${MODRINTH_TOKEN}" ]]; then
            echo "MODRINTH_TOKEN secret is required to publish tagged releases to Modrinth." >&2
            exit 1
          fi

          project_id="$(curl --fail --show-error --silent \
            -H "User-Agent: SequoiaWynncraft/sequoia-mod-release-workflow" \
            "https://api.modrinth.com/v2/project/${MODRINTH_PROJECT_SLUG}" | jq -r '.id')"

          if [[ -z "${project_id}" || "${project_id}" == "null" ]]; then
            echo "Failed to resolve Modrinth project ID for slug ${MODRINTH_PROJECT_SLUG}." >&2
            exit 1
          fi

          payload="$(jq -cn \
            --arg name "Sequoia ${VERSION_NUMBER}" \
            --arg version_number "${VERSION_NUMBER}" \
            --arg changelog "${CHANGELOG}" \
            --arg project_id "${project_id}" \
            --arg minecraft_version "${MINECRAFT_VERSION}" \
            --arg version_type "${VERSION_TYPE}" \
            '{
              name: $name,
              version_number: $version_number,
              changelog: $changelog,
              project_id: $project_id,
              game_versions: [$minecraft_version],
              version_type: $version_type,
              dependencies: [],
              loaders: ["fabric"],
              featured: true,
              status: "listed",
              file_parts: ["primary", "source"],
              primary_file: "primary"
            }'
          )"

          curl --fail-with-body --show-error --silent \
            -X POST "https://api.modrinth.com/v2/version" \
            -H "Authorization: ${MODRINTH_TOKEN}" \
            -H "User-Agent: SequoiaWynncraft/sequoia-mod-release-workflow" \
            --form-string "data=${payload}" \
            -F "primary=@${MOD_JAR}" \
            -F "source=@${SOURCE_ARCHIVE}"
