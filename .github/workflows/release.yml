name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      MODRINTH_PROJECT_SLUG: sequoia

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Java 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21.0.13+9'

      - name: Update Java certificate blocklist
        shell: bash
        run: bash scripts/install-java-blocklist.sh "$JAVA_HOME"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build release jar
        run: ./gradlew clean build remapJar --stacktrace -Pbackend_environment=production

      - name: Resolve release metadata
        id: release_metadata
        shell: bash
        run: |
          set -euo pipefail

          version_number="${GITHUB_REF_NAME#v}"
          minecraft_version="$(sed -n 's/^minecraft_version=//p' gradle.properties)"
          if [[ "$(git cat-file -t "refs/tags/$GITHUB_REF_NAME")" != tag ]]; then
            echo "An annotated tag with explicit release notes is required." >&2
            exit 1
          fi
          changelog="$(git tag -l --format='%(contents)' "$GITHUB_REF_NAME")"

          mapfile -t release_jars < <(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' | sort)
          if [[ "${#release_jars[@]}" -ne 1 ]]; then
            echo "Expected exactly one release jar, found ${#release_jars[@]}" >&2
            printf 'Found jars:\n%s\n' "${release_jars[@]}" >&2
            exit 1
          fi

          version_type="release"
          normalized_version="${version_number,,}"
          if [[ "$normalized_version" == *alpha* ]]; then
            version_type="alpha"
          elif [[ "$normalized_version" == *beta* ]]; then
            version_type="beta"
          fi

          generate_release_notes=false
          if [[ "$changelog" == "[no-release-notes]" ]]; then
            changelog=""
            generate_release_notes=false
          elif [[ -z "${changelog//[[:space:]]/}" || "$changelog" == "$GITHUB_REF_NAME" ]]; then
            echo "An annotated tag with explicit release notes is required." >&2
            exit 1
          fi

          changelog_delimiter="CHANGELOG_$(openssl rand -hex 16)"
          {
            echo "mod_jar=${release_jars[0]}"
            echo "minecraft_version=${minecraft_version}"
            echo "version_number=${version_number}"
            echo "version_type=${version_type}"
            echo "generate_release_notes=${generate_release_notes}"
            printf 'changelog<<%s\n%s\n%s\n' "$changelog_delimiter" "$changelog" "$changelog_delimiter"
          } >> "$GITHUB_OUTPUT"

      - name: Generate SHA-256 files
        shell: bash
        run: |
          set -euo pipefail
          for file in build/libs/*.jar; do
            sha256sum "$file" > "$file.sha256"
          done

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: ${{ steps.release_metadata.outputs.generate_release_notes == 'true' }}
          body: ${{ steps.release_metadata.outputs.changelog }}
          files: |
            build/libs/*.jar
            build/libs/*.jar.sha256

      - name: Publish to Modrinth
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MOD_VERSION: ${{ steps.release_metadata.outputs.version_number }}
          MOD_CHANGELOG: ${{ steps.release_metadata.outputs.changelog }}
          MOD_MINECRAFT_VERSION: ${{ steps.release_metadata.outputs.minecraft_version }}
          MOD_VERSION_TYPE: ${{ steps.release_metadata.outputs.version_type }}
          MOD_JAR: ${{ steps.release_metadata.outputs.mod_jar }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${MODRINTH_TOKEN}" ]]; then
            echo "MODRINTH_TOKEN secret is required to publish tagged releases to Modrinth." >&2
            exit 1
          fi

          project_id="$(curl --fail --show-error --silent \
            -H "User-Agent: SequoiaWynncraft/sequoia-mod-release-workflow" \
            "https://api.modrinth.com/v2/project/${MODRINTH_PROJECT_SLUG}" | jq -r '.id')"

          if [[ -z "${project_id}" || "${project_id}" == "null" ]]; then
            echo "Failed to resolve Modrinth project ID for slug ${MODRINTH_PROJECT_SLUG}." >&2
            exit 1
          fi

          payload="$(jq -cn \
            --arg name "Sequoia ${MOD_VERSION}" \
            --arg version_number "${MOD_VERSION}" \
            --arg changelog "${MOD_CHANGELOG}" \
            --arg project_id "${project_id}" \
            --arg minecraft_version "${MOD_MINECRAFT_VERSION}" \
            --arg version_type "${MOD_VERSION_TYPE}" \
            '{
              name: $name,
              version_number: $version_number,
              changelog: $changelog,
              project_id: $project_id,
              game_versions: [$minecraft_version],
              version_type: $version_type,
              dependencies: [],
              loaders: ["fabric"],
              featured: true,
              status: "listed",
              file_parts: ["primary"],
              primary_file: "primary"
            }'
          )"

          curl --fail-with-body --show-error --silent \
            -X POST "https://api.modrinth.com/v2/version" \
            -H "Authorization: ${MODRINTH_TOKEN}" \
            -H "User-Agent: SequoiaWynncraft/sequoia-mod-release-workflow" \
            --form-string "data=${payload}" \
            -F "primary=@${MOD_JAR}"
